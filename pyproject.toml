[project]
name = "qualcoder-mcp"
version = "0.2.0"
description = "Model Context Protocol server for Qualcoder qualitative data analysis"
authors = [{name = "MCP Developer"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
qualcoder-mcp = "qualcoder_mcp.server:main"
