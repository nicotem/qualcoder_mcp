[project]
name = "qualcoder-mcp"
version = "0.8.0-alpha"
description = "Model Context Protocol server for Qualcoder qualitative data analysis with AI-assisted coding"
authors = [{name = "Niccolo Tempini", email = "n.tempini@exeter.ac.uk"}]
# PEP 639 SPDX license expression (setuptools >= 77). The old
# "License :: OSI Approved :: MIT License" classifier is deprecated in
# favour of this expression and deliberately NOT listed below.
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "qualitative research",
    "qualcoder",
    "mcp",
    "model-context-protocol",
    "claude",
    "qda",
    "caqdas",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # <2 cap: mcp 2.0.0 (July 2026) removed mcp.server.fastmcp — an
    # uncapped install resolves to 2.x and the server cannot import
    # (verified empirically in a fresh venv). Lifting the cap is an
    # explicit migration project, not a routine bump.
    "mcp>=1.2.0,<2",
]

[project.urls]
Homepage = "https://github.com/nicotem/qualcoder_mcp"
Repository = "https://github.com/nicotem/qualcoder_mcp"
Issues = "https://github.com/nicotem/qualcoder_mcp/issues"
Changelog = "https://github.com/nicotem/qualcoder_mcp/blob/main/CHANGELOG.md"
Privacy = "https://github.com/nicotem/qualcoder_mcp/blob/main/PRIVACY.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "xmlschema>=3.0.0",
    "hypothesis>=6.100",
    "build>=1.2",
    "twine>=6.1",
]

[tool.pytest.ini_options]
markers = [
    "giant: large 10k+ coding / 500k-char build; opt-in via TRACK6_GIANT=1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
qualcoder-mcp = "qualcoder_mcp.server:main"
