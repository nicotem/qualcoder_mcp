name: Bug report
description: Something didn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test this alpha. A couple of things first:
        - **Please work on a copy of your data**, never an original.
        - **Don't paste participant data, interview text, or anything sensitive** into this issue. Describe the problem structurally instead (e.g. "a code name with an apostrophe", "a file with ~40k characters"). For what happens to research data when you *use* the tool, see [PRIVACY.md](https://github.com/nicotem/qualcoder_mcp/blob/main/PRIVACY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you ask your AI assistant to do, and what went wrong?
      placeholder: I asked the assistant to merge two codes and it…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The conversation or sequence of tools, as best you can reconstruct it.
    validations:
      required: false
  - type: input
    id: mcp-version
    attributes:
      label: qualcoder-mcp version
      description: Run `pip show qualcoder-mcp` (pipx users `pipx list`, uv users `uv tool list`), or ask your assistant "what version of the qualcoder server is running?". pip spells 0.11.0-alpha as 0.11.0a0; either is fine.
      placeholder: e.g. 0.11.0a0
    validations:
      required: true
  - type: input
    id: qualcoder-version
    attributes:
      label: QualCoder version
      description: A stable release (3.8.x) or the 4.0-Beta pre-release. For a pre-release build, add the git commit if you know it.
      placeholder: e.g. 3.8.2, or 4.0 Beta at commit 9bddf17
    validations:
      required: true
  - type: input
    id: schema-version
    attributes:
      label: Project schema version
      description: The `databaseversion` value in the `schema` block that `get_current_project` returns (ask your assistant to run it). Schemas v14 through v17 are supported.
      placeholder: e.g. v14 or v17
    validations:
      required: false
  - type: dropdown
    id: host
    attributes:
      label: MCP host application
      description: The application that runs the server for you.
      options:
        - Claude Desktop
        - Claude Code
        - LM Studio
        - Other (say which under "What happened?")
    validations:
      required: true
  - type: dropdown
    id: toolset
    attributes:
      label: Toolset (QUALCODER_MCP_TOOLSET)
      description: "`full` is the default when the variable is not set; `core` is the reduced set for local models."
      options:
        - full (default, or variable not set)
        - core
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: qualcoder-open
    attributes:
      label: Was the project open in QualCoder at the time?
      description: Writes are refused while a released QualCoder (3.x) has the project open; the 4.0-Beta pre-release writes no lock file and can only be detected heuristically.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.11
    validations:
      required: false
