name: Feature idea
description: Something that would make this more useful for your research
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Early adopters shape the roadmap here — feature ideas are as welcome as bug reports.
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: The research task or workflow, not just the feature — it helps to understand the underlying need.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working, if you have a picture in mind.
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: How do you handle this today?
    validations:
      required: false
