name: Publish to PyPI

# Two publish paths, both via PyPI Trusted Publishing (OIDC — no tokens,
# no secrets stored in the repo):
#
#   1. TestPyPI — manual dry-run: trigger the workflow by hand
#      (workflow_dispatch) and it publishes to test.pypi.org.
#   2. PyPI — the real thing: publishing happens automatically when a
#      GitHub Release is PUBLISHED.
#
# The owner must configure two trusted publishers on (Test)PyPI, both
# pointing at this repository + this workflow file (publish.yml):
#   - test.pypi.org  → project qualcoder-mcp, environment "testpypi"
#   - pypi.org       → project qualcoder-mcp, environment "pypi"

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are SHA-pinned (supply-chain hardening); the trailing
      # comment is the human-readable version Dependabot bumps against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Store distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI (manual dry-run)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qualcoder-mcp
    permissions:
      id-token: write  # mandatory for Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.1 (release/v1)
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI (on GitHub Release)
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qualcoder-mcp
    permissions:
      id-token: write  # mandatory for Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.1 (release/v1)
