name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        shell: bash
        run: |
          set +e
          python -m pytest -ra --tb=short -q 2>&1 | tee pytest_output.txt
          code=${PIPESTATUS[0]}
          {
            echo "### pytest — ${{ matrix.os }} / py${{ matrix.python-version }}"
            echo ""
            echo '```'
            grep -E "^[0-9]+ (passed|failed)| failed,| error" pytest_output.txt | tail -3
            grep -E "^(FAILED|ERROR) " pytest_output.txt | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest_output.txt
