name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]

    steps:
      # Actions are SHA-pinned (supply-chain hardening); the trailing
      # comment is the human-readable version Dependabot bumps against.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        shell: bash
        run: |
          set +e
          python -m pytest -ra --tb=short -q 2>&1 | tee pytest_output.txt
          code=${PIPESTATUS[0]}
          {
            echo "### pytest: ${{ matrix.os }} / py${{ matrix.python-version }}"
            echo ""
            echo '```'
            grep -E "^[0-9]+ (passed|failed)| failed,| error" pytest_output.txt | tail -3
            grep -E "^(FAILED|ERROR) " pytest_output.txt | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest_output.txt
