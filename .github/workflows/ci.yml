name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]

    steps:
      # Actions are SHA-pinned (supply-chain hardening); the trailing
      # comment is the human-readable version Dependabot bumps against.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        shell: bash
        run: |
          set +e
          python -m pytest -ra --tb=short -q 2>&1 | tee pytest_output.txt
          code=${PIPESTATUS[0]}
          {
            echo "### pytest: ${{ matrix.os }} / py${{ matrix.python-version }}"
            echo ""
            echo '```'
            grep -E "^[0-9]+ (passed|failed)| failed,| error" pytest_output.txt | tail -3
            grep -E "^(FAILED|ERROR) " pytest_output.txt | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest_output.txt
